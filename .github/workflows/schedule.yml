name: GitHub Actions Bot GForm

on:
  schedule:
    # Berjalan pada menit ke-17 di setiap jam (contoh: 01:17, 02:17, 03:17, dst)
    - cron: '17 * * * *'
  workflow_dispatch: # Mengizinkan untuk dijalankan manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wajib agar bot bisa nge-save file list nama.txt
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run script
        run: python auto_gform.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "list nama.txt"
          # Hanya commit kalau ada perubahan (berarti script berhasil mengisi dan menghapus 1 nama)
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update list nama.txt, 1 form tersubmit"
          git push
